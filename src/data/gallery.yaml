# talk: id from talks.yaml, when the photo is from that session
# layout: wide spans two columns; omit for a regular cell
# featured: position in the home page mosaic (1 is the large cell); omit to leave it out
# kit: offered as a high-resolution download on the speaker kit page
# focus: CSS object-position, used where the photo is cropped to fit

